# Keeps the «نبض بازار» economic calendar current: every day it re-reads the
# official schedules (Fed, ECB, BEA, BLS), rolls the 3-month window forward,
# rebuilds /market-pulse and commits only if something changed. Cloudflare
# Pages deploys that commit like any other push.
name: Market calendar auto-update

on:
  schedule:
    - cron: '17 2 * * *'   # daily 02:17 UTC (05:47 Tehran)
  workflow_dispatch:
  push:
    branches: [market-pulse]
    paths:
      - tools/market-pulse/update_calendar.py
      - .github/workflows/market-calendar.yml

permissions:
  contents: write

concurrency:
  group: market-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh calendar from official sources
        run: python tools/market-pulse/update_calendar.py
      - name: Rebuild Market Pulse page
        run: python tools/market-pulse/build.py
      - name: Commit if the calendar changed
        run: |
          git config user.name "blue-pyramid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # calendar-status.json changes on every run (check time); only commit when
          # the calendar itself or the page changed, but always keep status in that commit.
          if git diff --quiet -- tools/market-pulse/calendar.json market-pulse.html assets/; then
            echo "Calendar unchanged."
            exit 0
          fi
          git add tools/market-pulse/calendar.json tools/market-pulse/calendar-status.json market-pulse.html assets/ sitemap.xml
          git commit -m "chore(calendar): auto-update from official schedules"
          git pull --rebase --autostash
          git push
